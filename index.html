<script>

/* =====================================================
   تنظیمات
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/*
    هر حرکت مار 22 پیکسل
*/

const GRID = 22;


/*
    سرعت بازی
*/

const SPEED = 110;


/* =====================================================
   متغیرهای بازی
===================================================== */

let snake = [];

let apple = null;

let bigApple = null;


let direction = {
    x: 1,
    y: 0
};


let nextDirection = {
    x: 1,
    y: 0
};


let score = 0;

let best =
    Number(
        localStorage.getItem("snakeBest")
    ) || 0;


let gameOver = false;

let lastTime = 0;


/* =====================================================
   زمان سیب بزرگ
===================================================== */

/*
    هر 15 ثانیه یک سیب بزرگ

    مدت نمایش = 4 ثانیه
*/

let bigAppleNextTime =
    Date.now() + 15000;

let bigAppleVisibleUntil = 0;


/* =====================================================
   نمایش رکورد
===================================================== */

document.getElementById("best")
    .textContent = best;


/* =====================================================
   شروع بازی
===================================================== */

function restart() {

    snake = [];


    /*
        مار اولیه 7 قسمت دارد
    */

    for (let i = 0; i < 7; i++) {

        snake.push({

            x: 380 - i * GRID,

            y: 300

        });

    }


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    gameOver = false;

    bigApple = null;


    /*
        اولین سیب بزرگ
        15 ثانیه بعد ظاهر می‌شود
    */

    bigAppleNextTime =
        Date.now() + 15000;


    bigAppleVisibleUntil = 0;


    document.getElementById("score")
        .textContent = "0";


    document.getElementById("finalScore")
        .textContent = "0";


    document.getElementById("gameOver")
        .classList.remove("show");


    createApple();


    lastTime =
        performance.now();


    requestAnimationFrame(loop);

}


/* =====================================================
   ساخت سیب معمولی
===================================================== */

function createApple() {

    let attempts = 0;


    do {

        apple = {

            x: 30 + Math.random() * (W - 60),

            y: 30 + Math.random() * (H - 60)

        };


        attempts++;


    } while (

        snake.some(

            p =>

            Math.hypot(

                apple.x - p.x,

                apple.y - p.y

            ) < 45

        )

        &&

        attempts < 100

    );

}


/* =====================================================
   ساخت سیب بزرگ
===================================================== */

function createBigApple() {

    let attempts = 0;


    do {

        bigApple = {

            x: 45 + Math.random() * (W - 90),

            y: 45 + Math.random() * (H - 90)

        };


        attempts++;


    } while (

        snake.some(

            p =>

            Math.hypot(

                bigApple.x - p.x,

                bigApple.y - p.y

            ) < 50

        )

        &&

        attempts < 100

    );


    /*
        سیب بزرگ فقط 4 ثانیه دیده می‌شود
    */

    bigAppleVisibleUntil =
        Date.now() + 4000;

}


/* =====================================================
   تغییر جهت
===================================================== */

function changeDirection(dir) {


    /*
        بالا
    */

    if (

        dir === "up" &&

        direction.y !== 1

    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }


    /*
        پایین
    */

    if (

        dir === "down" &&

        direction.y !== -1

    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }


    /*
        چپ
    */

    if (

        dir === "left" &&

        direction.x !== 1

    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }


    /*
        راست
    */

    if (

        dir === "right" &&

        direction.x !== -1

    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }

}


/* =====================================================
   آپدیت بازی
===================================================== */

function update() {

    if (gameOver)
        return;


    const now = Date.now();


    /* =================================================
       حذف سیب بزرگ بعد از 4 ثانیه
    ================================================= */

    if (

        bigApple &&

        now >= bigAppleVisibleUntil

    ) {

        bigApple = null;

    }


    /* =================================================
       ظاهر شدن سیب بزرگ هر 15 ثانیه
    ================================================= */

    if (

        !bigApple &&

        now >= bigAppleNextTime

    ) {

        createBigApple();


        /*
            زمان بعدی ظاهر شدن
        */

        bigAppleNextTime =
            now + 15000;

    }


    /* =================================================
       اعمال جهت
    ================================================= */

    direction = {

        x: nextDirection.x,

        y: nextDirection.y

    };


    /* =================================================
       ساخت سر جدید
    ================================================= */

    let head = {

        x:
            snake[0].x
            +
            direction.x * GRID,

        y:
            snake[0].y
            +
            direction.y * GRID

    };


    /* =================================================
       عبور از دیوار
    ================================================= */

    if (head.x < 0)
        head.x = W - GRID;


    if (head.x >= W)
        head.x = 0;


    if (head.y < 0)
        head.y = H - GRID;


    if (head.y >= H)
        head.y = 0;


    /* =================================================
       برخورد با بدن خودش
    ================================================= */

    for (

        let i = 1;

        i < snake.length;

        i++

    ) {

        if (

            Math.hypot(

                head.x - snake[i].x,

                head.y - snake[i].y

            ) < 18

        ) {

            endGame();

            return;

        }

    }


    /* =================================================
       اضافه کردن سر
    ================================================= */

    snake.unshift(head);


    let ate = false;


    /* =================================================
       خوردن سیب معمولی
    ================================================= */

    if (

        apple &&

        Math.hypot(

            head.x - apple.x,

            head.y - apple.y

        ) < 28

    ) {

        /*
            سیب معمولی:

            10 امتیاز
        */

        score += 10;

        ate = true;


        /*
            دم حذف نمی‌شود

            پس مار یک قسمت
            بزرگ‌تر می‌شود
        */

        createApple();

    }


    /* =================================================
       خوردن سیب بزرگ
    ================================================= */

    if (

        bigApple &&

        Math.hypot(

            head.x - bigApple.x,

            head.y - bigApple.y

        ) < 32

    ) {

        /*
            سیب بزرگ:

            50 امتیاز
        */

        score += 50;

        ate = true;


        /*
            بلافاصله ناپدید می‌شود
        */

        bigApple = null;

    }


    /* =================================================
       اگر چیزی نخورده:
       دم حذف شود
    ================================================= */

    if (!ate) {

        snake.pop();

    }


    /* =================================================
       ذخیره بهترین امتیاز
    ================================================= */

    if (score > best) {

        best = score;


        localStorage.setItem(
            "snakeBest",
            best
        );


        document.getElementById("best")
            .textContent = best;

    }


    document.getElementById("score")
        .textContent = score;

}


/* =====================================================
   رسم سیب معمولی
===================================================== */

function drawApple() {

    if (!apple)
        return;


    ctx.save();


    ctx.shadowColor = "#ff2200";

    ctx.shadowBlur = 20;

    ctx.fillStyle = "#ff3020";


    /*
        دو قسمت سیب
    */

    ctx.beginPath();

    ctx.arc(
        apple.x - 7,
        apple.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.arc(
        apple.x + 7,
        apple.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        بدنه
    */

    ctx.beginPath();

    ctx.arc(
        apple.x,
        apple.y + 4,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        برگ
    */

    ctx.shadowBlur = 5;

    ctx.beginPath();

    ctx.ellipse(
        apple.x + 9,
        apple.y - 18,
        9,
        5,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#55ff00";

    ctx.fill();


    /*
        ساقه
    */

    ctx.beginPath();

    ctx.moveTo(
        apple.x,
        apple.y - 12
    );

    ctx.lineTo(
        apple.x + 2,
        apple.y - 22
    );

    ctx.strokeStyle = "#8b4513";

    ctx.lineWidth = 4;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   رسم سیب بزرگ
===================================================== */

function drawBigApple() {

    if (!bigApple)
        return;


    ctx.save();


    ctx.shadowColor = "#ff0000";

    ctx.shadowBlur = 35;


    /*
        گرادیان سیب بزرگ
    */

    const gradient =
        ctx.createRadialGradient(

            bigApple.x - 8,
            bigApple.y - 8,
            3,

            bigApple.x,
            bigApple.y,
            27

        );


    gradient.addColorStop(
        0,
        "#ff7777"
    );


    gradient.addColorStop(
        0.35,
        "#ff2222"
    );


    gradient.addColorStop(
        1,
        "#a90000"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();

    ctx.arc(
        bigApple.x,
        bigApple.y,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        ساقه
    */

    ctx.shadowBlur = 5;

    ctx.fillStyle = "#00ff00";

    ctx.fillRect(

        bigApple.x - 3,

        bigApple.y - 34,

        6,

        12

    );


    /*
        برگ
    */

    ctx.beginPath();

    ctx.ellipse(

        bigApple.x + 10,

        bigApple.y - 30,

        9,

        5,

        -0.4,

        0,

        Math.PI * 2

    );

    ctx.fill();


    /*
        برق روی سیب
    */

    ctx.fillStyle = "#ffffff";

    ctx.shadowBlur = 0;

    ctx.beginPath();

    ctx.arc(

        bigApple.x - 8,

        bigApple.y - 9,

        4,

        0,

        Math.PI * 2

    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   رسم مار
===================================================== */

function drawSnake() {

    if (
        !snake ||
        snake.length === 0
    )
        return;


    ctx.save();


    ctx.lineCap = "round";

    ctx.lineJoin = "round";


    /* =================================================
       بدن اصلی
    ================================================= */

    ctx.beginPath();


    ctx.moveTo(
        snake[0].x,
        snake[0].y
    );


    for (
        let i = 1;
        i < snake.length;
        i++
    ) {

        ctx.lineTo(
            snake[i].x,
            snake[i].y
        );

    }


    ctx.strokeStyle = "#4dff00";

    ctx.lineWidth = 30;

    ctx.shadowColor = "#52ff00";

    ctx.shadowBlur = 22;

    ctx.stroke();


    /* =================================================
       خط روشن وسط
    ================================================= */

    ctx.beginPath();


    ctx.moveTo(
        snake[0].x,
        snake[0].y - 3
    );


    for (
        let i = 1;
        i < snake.length;
        i++
    ) {

        ctx.lineTo(
            snake[i].x,
            snake[i].y - 3
        );

    }


    ctx.strokeStyle = "#b4ff50";

    ctx.lineWidth = 8;

    ctx.shadowBlur = 5;

    ctx.stroke();


    /* =================================================
       سر
    ================================================= */

    const h = snake[0];


    const sx =
        -direction.y * 8;


    const sy =
        direction.x * 8;


    const fx =
        direction.x * 8;


    const fy =
        direction.y * 8;


    const eye1 = {

        x: h.x + fx + sx,

        y: h.y + fy + sy

    };


    const eye2 = {

        x: h.x + fx - sx,

        y: h.y + fy - sy

    };


    /* سر */

    ctx.shadowColor = "#7cff00";

    ctx.shadowBlur = 25;


    ctx.beginPath();

    ctx.arc(

        h.x,

        h.y,

        20,

        0,

        Math.PI * 2

    );


    ctx.fillStyle = "#63ff00";

    ctx.fill();


    /* =================================================
       چشم‌ها
    ================================================= */

    ctx.shadowBlur = 3;

    ctx.fillStyle = "#000000";


    ctx.beginPath();

    ctx.arc(

        eye1.x,

        eye1.y,

        5,

        0,

        Math.PI * 2

    );


    ctx.arc(

        eye2.x,

        eye2.y,

        5,

        0,

        Math.PI * 2

    );


    ctx.fill();


    /* =================================================
       زبان
    ================================================= */

    ctx.beginPath();


    ctx.moveTo(

        h.x + direction.x * 18,

        h.y + direction.y * 18

    );


    ctx.lineTo(

        h.x + direction.x * 31,

        h.y + direction.y * 31

    );


    ctx.strokeStyle = "#ff3030";

    ctx.lineWidth = 2;

    ctx.stroke();


    /*
        دو شاخه زبان
    */

    ctx.beginPath();


    ctx.moveTo(

        h.x + direction.x * 31,

        h.y + direction.y * 31

    );


    ctx.lineTo(

        h.x
        + direction.x * 39
        - direction.y * 5,

        h.y
        + direction.y * 39
        + direction.x * 5

    );


    ctx.moveTo(

        h.x + direction.x * 31,

        h.y + direction.y * 31

    );


    ctx.lineTo(

        h.x
        + direction.x * 39
        + direction.y * 5,

        h.y
        + direction.y * 39
        - direction.x * 5

    );


    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   رسم کل بازی
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawApple();

    drawBigApple();

    drawSnake();

}


/* =====================================================
   پایان بازی
===================================================== */

function endGame() {

    gameOver = true;


    document.getElementById("finalScore")
        .textContent = score;


    document.getElementById("gameOver")
        .classList.add("show");

}


/* =====================================================
   حلقه بازی
===================================================== */

function loop(time) {

    if (gameOver)
        return;


    if (
        time - lastTime >= SPEED
    ) {

        update();

        draw();

        lastTime = time;

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   کیبورد
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {


        if (
            e.key === "ArrowUp" ||
            e.key === "w" ||
            e.key === "W"
        ) {

            changeDirection("up");

            e.preventDefault();

        }


        if (
            e.key === "ArrowDown" ||
            e.key === "s" ||
            e.key === "S"
        ) {

            changeDirection("down");

            e.preventDefault();

        }


        if (
            e.key === "ArrowLeft" ||
            e.key === "a" ||
            e.key === "A"
        ) {

            changeDirection("left");

            e.preventDefault();

        }


        if (
            e.key === "ArrowRight" ||
            e.key === "d" ||
            e.key === "D"
        ) {

            changeDirection("right");

            e.preventDefault();

        }


        /*
            Space = شروع دوباره
        */

        if (
            e.code === "Space" &&
            gameOver
        ) {

            restart();

        }

    }
);


/* =====================================================
   Swipe موبایل
===================================================== */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function(e) {

        if (!e.touches.length)
            return;


        touchStartX =
            e.touches[0].clientX;


        touchStartY =
            e.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function(e) {

        if (!e.changedTouches.length)
            return;


        const touchEndX =
            e.changedTouches[0].clientX;


        const touchEndY =
            e.changedTouches[0].clientY;


        const dx =
            touchEndX - touchStartX;


        const dy =
            touchEndY - touchStartY;


        const minSwipe = 25;


        if (
            Math.abs(dx) < minSwipe &&
            Math.abs(dy) < minSwipe
        ) {

            return;

        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {


            if (dx > 0) {

                changeDirection("right");

            } else {

                changeDirection("left");

            }


        } else {


            if (dy > 0) {

                changeDirection("down");

            } else {

                changeDirection("up");

            }

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   شروع اولیه بازی
===================================================== */

restart();
